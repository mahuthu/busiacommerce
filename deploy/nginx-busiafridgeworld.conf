# Host nginx site for Busia Fridge World
# Install on VPS:
#   sudo cp deploy/nginx-busiafridgeworld.conf /etc/nginx/sites-available/busiafridgeworld
#   sudo ln -sf /etc/nginx/sites-available/busiafridgeworld /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then (after DNS points here):
#   sudo certbot --nginx -d busiafridgeworld.com -d www.busiafridgeworld.com

# HTTP — Certbot will add HTTPS + redirect
server {
    listen 80;
    listen [::]:80;
    server_name busiafridgeworld.com www.busiafridgeworld.com;

    # Docker container publishes host port 3010 → container :80
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 20M;
        proxy_read_timeout 120s;
    }
}
